name: Void packaging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python3 -m unittest discover -s packaging/void/tests -v
      - run: bash -n packaging/void/build.sh packaging/void/test.sh packaging/void/smoke.sh packaging/void/reference-ffmpeg.sh
